<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Host Dashboard | LankaBuddy</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7f4;
    color: #173b31;
}

header {
    height: 72px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    border-bottom: 1px solid #e5e8e4;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #e28a4b;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #173b31;
    color: white;
    display: grid;
    place-items: center;
    font-weight: bold;
}

.layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 72px);
}

.sidebar {
    background: #173b31;
    color: white;
    padding: 30px 20px;
}

.sidebar h3 {
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    padding: 13px 12px;
    margin: 5px 0;
    border-radius: 8px;
    color: #d9e4df;
    text-decoration: none;
    font-size: 14px;
}

.sidebar a.active,
.sidebar a:hover {
    background: #285447;
    color: white;
}

.main {
    padding: 40px;
    max-width: 1200px;
    width: 100%;
}

.kicker {
    color: #d47b3d;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

h1 {
    font-family: Georgia, serif;
    font-size: 42px;
    margin: 10px 0 30px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 35px;
}

.stat {
    background: white;
    border: 1px solid #e5e8e4;
    border-radius: 14px;
    padding: 22px;
}

.stat small {
    color: #78857f;
}

.stat strong {
    display: block;
    font-size: 30px;
    margin-top: 8px;
}

.requests {
    background: white;
    border: 1px solid #e5e8e4;
    border-radius: 15px;
    overflow: hidden;
}

.requests-header {
    padding: 22px;
    border-bottom: 1px solid #e8ebe8;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.requests-header h2 {
    font-family: Georgia, serif;
}

.request {
    padding: 20px 22px;
    border-bottom: 1px solid #edf0ed;
    display: grid;
    grid-template-columns: 1fr 180px 190px;
    gap: 20px;
    align-items: center;
}

.guest {
    display: flex;
    align-items: center;
    gap: 12px;
}

.guest-avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #edf3ed;
    display: grid;
    place-items: center;
    font-weight: bold;
}

.guest-info strong {
    display: block;
}

.guest-info small {
    color: #7a8781;
}

.details {
    font-size: 13px;
    color: #65746d;
    line-height: 1.8;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    display: inline-block;
    margin-bottom: 8px;
    background: #fff3df;
    color: #b86a25;
}

.buttons {
    display: flex;
    gap: 8px;
}

.accept,
.reject {
    border: none;
    padding: 9px 13px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.accept {
    background: #173b31;
    color: white;
}

.reject {
    background: #f2f3f1;
    color: #66736d;
}

.empty {
    padding: 50px 20px;
    text-align: center;
    color: #78857f;
}

.loading {
    padding: 40px;
    text-align: center;
    color: #78857f;
}

@media (max-width: 800px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: none;
    }

    .main {
        padding: 25px 5%;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .request {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    h1 {
        font-size: 34px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        Lanka<span>Buddy</span>
    </div>

    <div class="profile">

        <strong>Host</strong>

        <div class="avatar">
            H
        </div>

    </div>

</header>


<div class="layout">


<aside class="sidebar">

    <h3>
        Host Dashboard
    </h3>

    <a href="#" class="active">
        📊 Dashboard
    </a>

    <a href="experience.html">
        🛶 My Experience
    </a>

    <a href="#">
        📅 Availability
    </a>

    <a href="#">
        ⭐ Reviews
    </a>

    <a href="#">
        ⚙️ Settings
    </a>

</aside>


<main class="main">

    <span class="kicker">
        LANKABUDDY HOST
    </span>

    <h1>
        Welcome back 👋
    </h1>


    <section class="stats">

        <div class="stat">

            <small>
                NEW REQUESTS
            </small>

            <strong id="newRequests">
                -
            </strong>

        </div>


        <div class="stat">

            <small>
                UPCOMING TRIPS
            </small>

            <strong id="upcomingTrips">
                -
            </strong>

        </div>


        <div class="stat">

            <small>
                TOTAL GUESTS
            </small>

            <strong id="totalGuests">
                -
            </strong>

        </div>

    </section>


    <section class="requests">

        <div class="requests-header">

            <h2>
                Recent Requests
            </h2>

            <span>
                🦞 Oruwa Fishing
            </span>

        </div>


        <div id="requestList">

            <div class="loading">
                Loading requests...
            </div>

        </div>

    </section>

</main>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://qxalcxhvtkpuvfcpnhti.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_sdJv_YFU55cxoma4x9jLRA_90RFnj5Y";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const requestList =
    document.getElementById("requestList");

const newRequests =
    document.getElementById("newRequests");

const upcomingTrips =
    document.getElementById("upcomingTrips");

const totalGuests =
    document.getElementById("totalGuests");


async function loadRequests() {

    const { data, error } =
        await supabaseClient
            .from("booking_requests")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        requestList.innerHTML = `
            <div class="empty">
                Unable to load requests.
            </div>
        `;

        return;
    }


    updateStats(data);

    renderRequests(data);

}


function updateStats(data) {

    const pending =
        data.filter(
            item => item.status === "pending"
        ).length;


    const accepted =
        data.filter(
            item => item.status === "accepted"
        ).length;


    const guests =
        data.reduce(
            (total, item) =>
                total + Number(item.guests || 0),
            0
        );


    newRequests.innerText =
        pending;

    upcomingTrips.innerText =
        accepted;

    totalGuests.innerText =
        guests;

}


function renderRequests(data) {

    if (!data || data.length === 0) {

        requestList.innerHTML = `
            <div class="empty">
                🦞 No booking requests yet.
            </div>
        `;

        return;
    }


    requestList.innerHTML =
        data.map(request => {

            const initials =
                request.guest_name
                    .split(" ")
                    .map(word => word[0])
                    .join("")
                    .substring(0, 2)
                    .toUpperCase();


            let statusClass =
                request.status;


            return `

                <div class="request">

                    <div class="guest">

                        <div class="guest-avatar">
                            ${initials}
                        </div>

                        <div class="guest-info">

                            <strong>
                                ${escapeHtml(request.guest_name)}
                            </strong>

                            <small>
                                ${escapeHtml(request.guest_email)}
                            </small>

                        </div>

                    </div>


                    <div class="details">

                        📅 ${request.booking_date}<br>

                        👥 ${request.guests}
                        Guest${request.guests == 1 ? "" : "s"}

                    </div>


                    <div>

                        <span class="status">
                            ${escapeHtml(request.status)}
                        </span>

                        ${
                            request.status === "pending"
                            ? `

                            <div class="buttons">

                                <button
                                    class="accept"
                                    onclick="updateStatus(${request.id}, 'accepted')"
                                >
                                    Accept
                                </button>

                                <button
                                    class="reject"
                                    onclick="updateStatus(${request.id}, 'rejected')"
                                >
                                    Reject
                                </button>

                            </div>

                            `
                            : ""
                        }

                    </div>

                </div>

            `;

        }).join("");

}


async function updateStatus(id, newStatus) {

    const { error } =
        await supabaseClient
            .from("booking_requests")
            .update({
                status: newStatus
            })
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Could not update request."
        );

        return;
    }


    await loadRequests();

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


loadRequests();

</script>


</body>

</html>
